<style>
  body {

  }
  .box {
    background: #fff; padding: 2.5rem 2.5rem 2rem; border-radius: 12px;

  button {
    width: 100%; font: inherit; font-weight: 600; padding: .7rem; border: 0;
    border-radius: 8px; background: #2563eb; color: #fff; cursor: pointer;
  }
  button:disabled { background: #9db8f0; cursor: default; }
  .msg { min-height: 1.3em; margin-top: .9rem; font-size: .9rem; color: #b91c1c; }
</style>

const ITERATIONS = 600000;
const form = document.getElementById('f');
const field = document.getElementById('p');
const button = document.getElementById('b');
const message = document.getElementById('m');

async function unlock(password, quiet) {
  const blob = Uint8Array.from(atob(PAYLOAD), ch => ch.charCodeAt(0));
  const salt = blob.slice(0, 16);
  const nonce = blob.slice(16, 28);
  const body = blob.slice(28);
  const baseKey = await crypto.subtle.importKey(
    'raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    {name: 'PBKDF2', salt: salt, iterations: ITERATIONS, hash: 'SHA-256'},
    baseKey, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt(
    {name: 'AES-GCM', iv: nonce}, key, body);
  const html = new TextDecoder().decode(plain);
  sessionStorage.setItem('deck-key', password);
  document.open();
  document.write(html);
  document.close();
}

form.addEventListener('submit', async event => {
  event.preventDefault();
  button.disabled = true;
  message.style.color = '#555';
  message.textContent = 'Låser opp…';
  try {
    await unlock(field.value, false);
  } catch (err) {
    message.style.color = '#b91c1c';
    message.textContent = 'Feil passord.';
    button.disabled = false;
    field.select();
  }
});

const remembered = sessionStorage.getItem('deck-key');
if (remembered) {
  unlock(remembered, true).catch(() => sessionStorage.removeItem('deck-key'));
}
</script>
